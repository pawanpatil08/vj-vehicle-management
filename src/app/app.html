<header class="app-header" *ngIf="authService.isAuthenticated() || authService.authState().loading">
  <div class="header-left">
    <div class="header-brand" (click)="goToDashboard()" style="cursor: pointer;">Vehicle &amp; data Management</div>
  </div>

  <div class="header-right">
    <!-- <button type="button" class="secondary-btn" style="margin-right: 1rem;" (click)="router.navigate([&apos;/dashboard&apos;])" aria-label="Go to Dashboard">← Dashboard</button> -->
    <button class="profile-button" type="button" (click)="router.navigate([&apos;/profile&apos;])" aria-label="Open profile page" [disabled]="!authService.isAuthenticated()">
      <span class="avatar">{{ avatarInitial }}</span>
    </button>
  </div>
</header>

<!-- Global loading overlay -->
@if (loadingService.isLoading()) {
  <div class="global-loading-overlay">
    <div class="global-loading-spinner">
      <i class="fas fa-spinner fa-spin"></i>
      <span>Loading...</span>
    </div>
  </div>
}

<router-outlet></router-outlet>
